# Netlify detects Next.js and applies the OpenNext adapter (@netlify/next) on each build.
# Do not pin @netlify/plugin-nextjs: pinning opts out of that runtime.
# Route handlers in app/api become Netlify Functions. OPENAI_API_KEY and DATABASE_URL
# stay in the function environment. Never prefix them with NEXT_PUBLIC_.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[dev]
  command = "npm run dev"
  targetPort = 3847
  port = 8888
  framework = "#auto"
